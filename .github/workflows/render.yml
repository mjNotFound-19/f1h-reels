# Renders an f1.h reel from the public site data and keeps it as a downloadable artifact for 30 days.
# Started by the private f1.h agent (workflow_dispatch needs write access to this repository); no secrets are used.
name: render reel
run-name: reel ${{ inputs.name }} ${{ inputs.only }}
on:
  workflow_dispatch:
    inputs:
      kind: { description: 'result, forecast or sprint', required: true, type: choice, options: [result, forecast, sprint] }
      name: { description: 'file name, e.g. f1h-R22-result', required: true, type: string }
      url: { description: 'site', required: false, type: string, default: 'https://manasjha.online/f1/' }
      only: { description: 'story or wide (one part per run, so the story is not held up)', required: true, type: choice, options: [story, wide] }
permissions: { contents: read }
env:
  TZ: America/Toronto
  REEL_FPS: '60'          # no GPU here: the 16:9 is 4K at 60 fps (LinkedIn plays 60 at most)
  REEL_STORY_DPR: '1'     # and the story is drawn at 1080 x 1920 (what Instagram shows)
  REEL_CAR: still         # the 3D car drawn once and moved like a photo (a 3D frame takes seconds without a GPU)
jobs:
  part:                   # the frames, split across several machines at once
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        part: ${{ fromJSON(inputs.only == 'story' && '[0,1,2,3]' || '[0,1,2,3,4,5]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Tools
        run: |
          pip install numpy==2.3.4 scipy==1.16.3
          npm install -g @playwright/cli
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render slice
        run: bash web/scripts/make-video-parts.sh part "${{ inputs.kind }}" "${{ inputs.url }}" "${{ inputs.name }}" "${{ inputs.only }}" ${{ matrix.part }} ${{ inputs.only == 'story' && 4 || 6 }}
      - uses: actions/upload-artifact@v4
        with:
          name: slice-${{ matrix.part }}
          path: docs/video/parts/
          retention-days: 1
  merge:                  # the slices joined, the soundtrack added, the files made
    needs: part
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.14' }
      - name: Tools
        run: |
          pip install numpy==2.3.4 scipy==1.16.3
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { pattern: 'slice-*', path: docs/video/parts, merge-multiple: true }
      - name: Merge
        run: bash web/scripts/make-video-parts.sh merge "${{ inputs.kind }}" "${{ inputs.url }}" "${{ inputs.name }}" "${{ inputs.only }}"
      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.name }}-${{ inputs.only }}
          path: |
            docs/video/${{ inputs.name }}*.mp4
            docs/video/${{ inputs.name }}-thumbnail.jpg
            docs/video/${{ inputs.name }}-render.log
          retention-days: 30
